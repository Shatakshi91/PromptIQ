server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path not matching a real file falls back to index.html,
    # so React Router's client-side routes (e.g. /chat/:id, /profile) work on
    # direct load/refresh instead of returning Nginx's default 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend service, so the frontend never
    # needs to know the backend's real hostname — same pattern as the Vite
    # dev-server proxy from Feature 0, just implemented at the Nginx layer instead.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (Feature 5 streaming) — without these, Nginx buffers
        # the whole response before sending it, defeating token-by-token streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}