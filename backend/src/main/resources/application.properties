spring.application.name=PromptIQ

# PostgreSQL (Neon) - values come from Environment Variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

app.llm.provider=openrouter
app.llm.openrouter.base-url=https://openrouter.ai/api/v1
app.llm.openrouter.api-key=${OPENROUTER_API_KEY}
app.llm.openrouter.model=openai/gpt-4o-mini
app.llm.openrouter.referer=${APP_REFERER:http://localhost:5173}
app.llm.openrouter.title=AI Agent Platform
app.llm.request-timeout-seconds=60

app.embedding.openrouter.base-url=https://openrouter.ai/api/v1
app.embedding.openrouter.api-key=${OPENROUTER_API_KEY}
app.embedding.openrouter.model=openai/text-embedding-3-small
app.embedding.openrouter.dimensions=1536

logging.level.com.PromptIQ=INFO
logging.level.org.springframework.security=WARN



